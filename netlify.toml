[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NITRO_PRESET = "netlify"
  NODE_VERSION = "20"
  # The Supabase project ID is a public identifier embedded in the browser API URL.
  SECRETS_SCAN_OMIT_KEYS = "SUPABASE_PROJECT_ID"

[functions]
  directory = ".netlify/functions-internal"

# Route non-static requests to Nitro's serverless function (SSR, TanStack Start & API routes)
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/server"
  status = 200
  force = false

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
