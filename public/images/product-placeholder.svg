<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
  </defs>
  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#bg)"/>
  
  <!-- Subtle Grid Accent -->
  <g stroke="#cbd5e1" stroke-width="1" opacity="0.35" stroke-dasharray="4,4">
    <line x1="150" y1="0" x2="150" y2="600"/>
    <line x1="300" y1="0" x2="300" y2="600"/>
    <line x1="450" y1="0" x2="450" y2="600"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="450" x2="600" y2="450"/>
  </g>

  <!-- Central Card & Placeholder Icon -->
  <g filter="url(#shadow)">
    <rect x="180" y="160" width="240" height="240" rx="32" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  </g>

  <!-- Minimal Camera / Product Box Graphic -->
  <g fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" transform="translate(240, 220)">
    <!-- Camera body -->
    <path d="M10 25 C10 18 15 13 22 13 L36 13 L42 5 L78 5 L84 13 L98 13 C105 13 110 18 110 25 L110 85 C110 92 105 97 98 97 L22 97 C15 97 10 92 10 85 Z" stroke="#00a884" stroke-width="5" fill="#f0fdf4"/>
    <!-- Lens -->
    <circle cx="60" cy="55" r="24" stroke="#00a884" stroke-width="5" fill="#ffffff"/>
    <circle cx="60" cy="55" r="10" fill="#00a884"/>
    <circle cx="92" cy="30" r="4" fill="#00a884"/>
  </g>

  <!-- Typography Labels -->
  <text x="300" y="445" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="0.5">
    Product Image
  </text>
  <text x="300" y="475" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="middle">
    Upload a photo or enter image URL
  </text>
</svg>
